<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoerzXcode — Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { scroll-behavior: smooth; }
        body { background: #09090b; }
        .glass { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .nav-link { transition: color 0.2s; position: relative; }
        .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #fff; transition: width 0.3s ease; }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .mobile-menu { transition: all 0.3s ease-in-out; transform-origin: top; }
        .mobile-menu.closed { opacity: 0; transform: scaleY(0.8); pointer-events: none; }
        .mobile-menu.open { opacity: 1; transform: scaleY(1); pointer-events: auto; }
        .toast { animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .spinner { border: 3px solid #27272a; border-top-color: #fff; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .code-block { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #e4e4e7; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        select option { background: #18181b; color: #fff; }
        .downloader-card { transition: all 0.3s ease; }
        .downloader-card:hover { border-color: #3f3f46; }
        .preview-img { max-height: 420px; object-fit: contain; border-radius: 12px; border: 1px solid #27272a; }
    </style>
</head>
<body>

    <!-- ====== NAVBAR ====== -->
    <nav class="sticky top-0 z-50 glass border-b border-zinc-800/60 px-4 py-3 md:px-6">
        <div class="mx-auto flex max-w-7xl items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-lg font-bold text-white tracking-tight">
                <i data-lucide="code-2" class="h-5 w-5"></i>
                NoerzXcode
            </a>
            <div class="hidden items-center gap-6 text-sm font-medium text-zinc-400 md:flex">
                <a href="index.html" class="nav-link hover:text-white">Home</a>
                <a href="tools.html" class="nav-link hover:text-white">Tools</a>
                <a href="canvas.html" class="nav-link hover:text-white">Canvas</a>
                <a href="downloader.html" class="nav-link active text-white">Downloader</a>
                <a href="about.html" class="nav-link hover:text-white">About</a>
            </div>
            <button id="menuToggle" class="text-zinc-400 transition hover:text-white md:hidden">
                <i data-lucide="menu" class="h-6 w-6"></i>
            </button>
        </div>
        <div id="mobileMenu" class="mobile-menu closed mt-3 flex flex-col gap-2 border-t border-zinc-800/60 pt-4 md:hidden">
            <a href="index.html" class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-white transition">Home</a>
            <a href="tools.html" class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-white transition">Tools</a>
            <a href="canvas.html" class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-white transition">Canvas</a>
            <a href="downloader.html" class="rounded-lg px-3 py-2 text-sm font-medium text-white bg-zinc-800/40">Downloader</a>
            <a href="about.html" class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-white transition">About</a>
        </div>
    </nav>

    <!-- ====== MAIN ====== -->
    <main class="px-4 py-8 md:px-6 md:py-12">
        <div class="mx-auto max-w-5xl">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-white md:text-3xl">Downloader Tools</h1>
                <p class="text-sm text-zinc-400">Unduh video, audio, dan konten dari berbagai platform</p>
            </div>
            <div class="space-y-8" id="downloaderContainer"></div>
        </div>
    </main>

    <!-- ====== FOOTER ====== -->
    <footer class="border-t border-zinc-800/60 bg-zinc-950/50 px-4 py-8 md:px-6">
        <div class="mx-auto max-w-7xl">
            <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
                <div><div class="flex items-center gap-2 text-lg font-bold text-white"><i data-lucide="code-2" class="h-5 w-5"></i> NoerzXcode</div><p class="mt-1 text-xs text-zinc-500">Web Developer • Web Tools • REST API</p></div>
                <div class="flex flex-wrap gap-4 text-sm text-zinc-400">
                    <a href="index.html" class="transition hover:text-white">Home</a>
                    <a href="tools.html" class="transition hover:text-white">Tools</a>
                    <a href="canvas.html" class="transition hover:text-white">Canvas</a>
                    <a href="downloader.html" class="transition hover:text-white">Downloader</a>
                    <a href="about.html" class="transition hover:text-white">About</a>
                </div>
            </div>
            <div class="mt-6 border-t border-zinc-800/40 pt-4 text-center text-xs text-zinc-600">© 2026 NoerzXcode. All rights reserved.</div>
        </div>
    </footer>

    <!-- ====== TOAST ====== -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 z-[999] w-full max-w-sm -translate-x-1/2 px-4 pointer-events-none"></div>

    <!-- ====== SCRIPTS ====== -->
    <script type="module">
        import { renderDownloaderTools } from './js/main.js';
        import { showToast } from './js/utils.js';

        lucide.createIcons();
        renderDownloaderTools();

        // Mobile menu
        const toggle = document.getElementById('menuToggle');
        const menu = document.getElementById('mobileMenu');
        let isOpen = false;
        toggle.addEventListener('click', function() {
            isOpen = !isOpen;
            menu.classList.toggle('closed');
            menu.classList.toggle('open');
            const icon = toggle.querySelector('i');
            icon.setAttribute('data-lucide', isOpen ? 'x' : 'menu');
            lucide.createIcons();
        });

        window.showToast = showToast;
    </script>
</body>
</html>
